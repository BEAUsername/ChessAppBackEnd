name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Builds and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew assemble
      - run: ./gradlew test
      - uses: actions/upload-artifact@v4
        with:
            name: CI-ChessApp-jar
            path: build/libs/ChessBackEnd-0.0.1.jar

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: CI-ChessApp-jar
          path: build/libs
      - run: docker build -f Dockerfile.ci -t chessapp-backend .
      - run: docker run -d -p 8080:8080 --name chessapp-backend chessapp-backend
      - name: Verify API response
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:8080/api/players; then
              echo "The API responded successfully."
              exit 0
            fi
            sleep 2
          done
          docker logs chessapp-backend
          exit 1