name: Continuous Integration

on:
    push:
      branches: [ main, develop ]
    pull_request:
      branches: [ main, develop ]

jobs:
  build:
    name: Builds and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew assemble
      - run: ./gradlew test
      - uses: actions/upload-artifact@v4
        with:
            name: CI-ChessApp-jar
            path: build/libs/ChessBackEnd-0.0.1.jar

  docker:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: CI-ChessApp-jar
          path: build/libs
      - run: docker build -t chessapp-backend .
      - run: docker run -d -p 8080:8080 --name chessapp-backend chessapp-backend
      - name: Verify API response
        run: curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/api/players

      - name: Log in to ghcr.io
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to ghcr.io
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chessapp-backend
          docker tag chessapp-backend $IMAGE:latest
          docker tag chessapp-backend $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}