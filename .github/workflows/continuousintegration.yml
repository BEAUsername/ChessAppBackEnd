name: Continuous Integration

on:
    push:
      branches: [ main, develop ]
    pull_request:
      branches: [ main, develop ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-java-gradle
      - run: ./gradlew assemble
      - uses: actions/upload-artifact@v4
        with:
          name: CI-ChessApp-jar
          path: build/libs/ChessBackEnd-0.0.1.jar

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-java-gradle
      - run: ./gradlew test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CI-test-reports
          path: build/reports/tests/

  docker:
    runs-on: ubuntu-latest
    needs: [build, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: CI-ChessApp-jar
          path: build/libs
      - run: docker build -t chessapp-backend-image .
      - run: docker run -d -p 8080:8080 --name chessapp-backend chessapp-backend-image
      - name: Verify API response
        run: curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/api/players

      - name: Log in to ghcr.io
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to ghcr.io
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chessapp-backend
          docker tag chessapp-backend-image $IMAGE:latest
          docker tag chessapp-backend-image $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}