name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-java-gradle
      - run: ./gradlew assemble
      - uses: actions/upload-artifact@v4
        with:
          name: CI-ChessApp-jar
          path: build/libs/ChessBackEnd-0.0.1.jar

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-java-gradle
      - run: ./gradlew test jacocoTestReport
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CI-test-reports
          path: |
            build/reports/tests/
            build/reports/jacoco/

  docker:
    runs-on: ubuntu-latest
    needs: [build, test]
    permissions:
      contents: read
      packages: write
    services:
      database:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ci-test-db-root
          MYSQL_DATABASE: chessapp
          MYSQL_USER: ci-test-db
          MYSQL_PASSWORD: ci-test-db-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-test-db-root"
          --health-interval=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: CI-ChessApp-jar
          path: build/libs
      - run: docker build -t chessapp-backend-image .
      - run: >
          docker run -d --network host --name chessapp-backend
          -e SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/chessapp
          -e SPRING_DATASOURCE_USERNAME=ci-test-db
          -e SPRING_DATASOURCE_PASSWORD=ci-test-db-pass
          -e JWT_SECRET=ci-test-secret-only-for-github-actions-0123456789
          chessapp-backend-image
      - name: Verify API response
        run: curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/api/players

      - name: Log in to ghcr.io
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to ghcr.io
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chessapp-backend
          docker tag chessapp-backend-image $IMAGE:latest
          docker tag chessapp-backend-image $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}