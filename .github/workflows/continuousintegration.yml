
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest
    steps:
      - name: Download repository source code
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile application source code
        run: ./gradlew assemble


  test:
    name: Run automated tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download repository source code
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run automated tests
        run: ./gradlew test

  docker:
    name: Build and verify Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Download repository source code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t chessapp-backend .

      - name: Start Docker container
        run: docker run -d -p 8080:8080 --name chessapp-backend chessapp-backend

      - name: Verify API response
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:8080/api/players; then
              echo ""
              echo "The API responded successfully."
              exit 0
            fi
            sleep 2
          done
          echo "API did not respond within 60 seconds. Container logs:"
          docker logs chessapp-backend
          exit 1
