name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and run the tests
        run: ./gradlew build

  docker:
    name: Build and check Docker image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Build the Docker image
        run: docker build -t chessapp-backend .

      - name: Start a container from the image
        run: docker run -d -p 8080:8080 --name chessapp-backend chessapp-backend

      - name: Check that the API answers
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:8080/api/players; then
              echo ""
              echo "The API answered."
              exit 0
            fi
            sleep 2
          done
          echo "The API did not answer within 60 seconds. Container logs:"
          docker logs chessapp-backend
          exit 1