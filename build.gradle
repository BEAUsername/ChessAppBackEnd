plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.sonarqube' version '7.5.0.8588'
}

group = 'org.chess'
version = '0.0.1'
description = 'ChessBackEnd'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
}

// JaCoCo: measures which lines the unit tests run (0.8.14+ is needed for Java 25)
jacoco {
    toolVersion = '0.8.15'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true   // read by SonarQube
        html.required = true  // for you to open in a browser
    }
}

// SonarQube: static code analysis + shows the JaCoCo coverage
sonar {
    properties {
        property 'sonar.projectKey', 'ChessBackEnd'
        property 'sonar.projectName', 'ChessBackEnd'
        property 'sonar.host.url', 'http://localhost:9000'
        property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
        property 'sonar.coverage.exclusions',
                '**/ChessBackEndApplication.java, **/config/**, **/dtoRequests/**, **/dtoResponse/**'
    }
}